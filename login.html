<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Rabbio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-wrap">
        <div class="auth-left">
          <div class="auth-left-brand">
            <a class="logo" href="index.html">rabbio</a>
            <a class="auth-nav-link" href="index.html">← Back to site</a>
          </div>
          <div class="auth-left-content">
            <h1>Welcome back to your command center.</h1>
            <p>
              Pick up where you left off. Your models, harnesses, and memory are
              waiting.
            </p>
            <div class="auth-provider-hints">
              <div class="provider-hint">
                <img src="assets/logo/Claude.png" alt="" />
                <span><strong>Claude</strong> · connected</span>
              </div>
              <div class="provider-hint">
                <img src="assets/logo/OpenAI.png" alt="" />
                <span><strong>OpenAI</strong> · connected</span>
              </div>
              <div class="provider-hint">
                <img src="assets/logo/Gemini.png" alt="" />
                <span><strong>Gemini</strong> · connected</span>
              </div>
            </div>
          </div>
          <p style="font-size: 0.72rem; color: var(--muted)">
            © 2026 Rabbio
          </p>
        </div>
        <div class="auth-right">
          <h2>Log in</h2>
          <p>Enter your workspace credentials.</p>
          <form class="auth-form" novalidate>
            <div class="field">
              <label>Email</label>
              <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="field">
              <label>Password</label>
              <input
                type="password"
                name="password"
                placeholder="••••••••"
                required
              />
            </div>
            <button class="auth-submit" type="submit">Log in</button>
            <p class="form-note" role="status" aria-live="polite"></p>
          </form>
          <p class="auth-switch">
            No account? <a href="signup.html">Sign up free</a>
          </p>
        </div>
      </div>
    </div>
    <script src="assets/js/main.js"></script>
  </body>
</html>
