name: "Deploy to GitHub Pages"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: "Step 1: Download code from repository"
        uses: actions/checkout@v4

      - name: "Step 2: Configure hosting environment"
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: "Step 3: Package website files"
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: "Step 4: Push live to internet"
        id: deployment
        uses: actions/deploy-pages@v4
